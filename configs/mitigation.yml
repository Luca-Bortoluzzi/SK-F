# Controlled DoS mitigation laboratory. It preserves the client, routing, and
# attacker structure of dos_lab while placing a rate-limiting TCP reverse proxy
# in front of a server located on a private, non-routed backend network.
# The simulation target is the proxy: ./simulate.sh mitigation --target proxy
lab:
  name: mitigation
  description: "Enterprise DoS mitigation with a rate-limiting reverse proxy"
  version: "2.0"
  author: Luca-Bortoluzzi
  email: luca.bortoluzzi921@edu.unito.it
  web: http://www.kathara.org/

nodes:
  # Legitimate user LAN A
  pc_a1:
    interfaces: [{network: lan_a, ip: 10.10.1.10/24}]

  pc_a2:
    interfaces: [{network: lan_a, ip: 10.10.1.11/24}]

  pc_a3:
    interfaces: [{network: lan_a, ip: 10.10.1.12/24}]

  pc_a4:
    interfaces: [{network: lan_a, ip: 10.10.1.13/24}]

  # Legitimate user LAN B
  pc_b1:
    interfaces: [{network: lan_b, ip: 10.10.2.10/24}]

  pc_b2:
    interfaces: [{network: lan_b, ip: 10.10.2.11/24}]

  pc_b3:
    interfaces: [{network: lan_b, ip: 10.10.2.12/24}]

  pc_b4:
    interfaces: [{network: lan_b, ip: 10.10.2.13/24}]

  # Attacker and controlled zombie network
  attacker:
    interfaces: [{network: lan_attackers, ip: 10.20.1.10/24}]
    files: attacker/
    roles: [attacker]

  zombie_1:
    interfaces: [{network: lan_attackers, ip: 10.20.1.11/24}]
    files: zombie_1/
    startup:
      - python3 /hostlab/zombie_1/zombie.py > /tmp/zombie.log 2>&1 &
    roles: [zombie]

  zombie_2:
    interfaces: [{network: lan_attackers, ip: 10.20.1.12/24}]
    files: zombie_2/
    startup:
      - python3 /hostlab/zombie_2/zombie.py > /tmp/zombie.log 2>&1 &
    roles: [zombie]

  zombie_3:
    interfaces: [{network: lan_attackers, ip: 10.20.1.13/24}]
    files: zombie_3/
    startup:
      - python3 /hostlab/zombie_3/zombie.py > /tmp/zombie.log 2>&1 &
    roles: [zombie]

  # Public server endpoint implemented by the reverse proxy
  proxy:
    interfaces:
      - {network: dmz_public,      ip: 10.30.1.10/24}
      - {network: backend_service, ip: 10.30.2.1/24}
    files: proxy/
    startup:
      - PROXY_BACKEND_HOST=10.30.2.10 PROXY_MAX_PER_SOURCE=2 PROXY_MAX_ACTIVE=32 python3 /hostlab/proxy/reverse_proxy.py > /tmp/reverse_proxy.log 2>&1 &
    roles: [proxy]

  # Private application server, unreachable from the routed network.
  # Its gateway is the proxy, a host, so it cannot be derived.
  server:
    interfaces: [{network: backend_service, ip: 10.30.2.10/24}]
    gateway: 10.30.2.1
    files: server/
    startup:
      - SERVICE_MAX_ACTIVE=20 SERVICE_BACKLOG=20 SERVICE_METRICS_PATH=/shared/server_metrics.csv SERVICE_METRICS_SCENARIO_PATH=/shared/server_metrics_scenario python3 /hostlab/server/service.py > /tmp/service.log 2>&1 &
    roles: [server]

  # Enterprise routing core, identical to the unmitigated lab
  r1:
    type: router
    interfaces:
      - {network: lan_a, ip: 10.10.1.1/24}
      - {network: r1_r2, ip: 10.0.12.1/30}
      - {network: r1_r3, ip: 10.0.13.1/30}
    ospf:
      router_id: 1.1.1.1
      areas:
        - {id: 0, networks: [lan_a, r1_r2, r1_r3]}

  r2:
    type: router
    interfaces:
      - {network: lan_b,   ip: 10.10.2.1/24}
      - {network: r1_r2,   ip: 10.0.12.2/30}
      - {network: r2_r4,   ip: 10.0.24.1/30}
      - {network: r2_core, ip: 10.0.25.1/30}
    ospf:
      router_id: 2.2.2.2
      areas:
        - {id: 0, networks: [lan_b, r1_r2, r2_r4, r2_core]}

  r3:
    type: router
    interfaces:
      - {network: r1_r3,   ip: 10.0.13.2/30}
      - {network: r3_r4,   ip: 10.0.34.1/30}
      - {network: r3_core, ip: 10.0.35.1/30}
    ospf:
      router_id: 3.3.3.3
      areas:
        - {id: 0, networks: [r1_r3, r3_r4, r3_core]}

  r4:
    type: router
    interfaces:
      - {network: r2_r4,   ip: 10.0.24.2/30}
      - {network: r3_r4,   ip: 10.0.34.2/30}
      - {network: r4_core, ip: 10.0.45.1/30}
    ospf:
      router_id: 4.4.4.4
      areas:
        - {id: 0, networks: [r2_r4, r3_r4, r4_core]}

  core:
    type: router
    interfaces:
      - {network: r2_core,       ip: 10.0.25.2/30}
      - {network: r3_core,       ip: 10.0.35.2/30}
      - {network: r4_core,       ip: 10.0.45.2/30}
      - {network: dmz_public,    ip: 10.30.1.1/24}
      - {network: lan_attackers, ip: 10.20.1.1/24}
    ospf:
      router_id: 5.5.5.5
      areas:
        - {id: 0, networks: [r2_core, r3_core, r4_core, dmz_public, lan_attackers]}
